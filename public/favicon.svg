<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dynamic Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#4A3B10" />
    </linearGradient>
  </defs>

  <!-- Dark Luxury Background -->
  <rect width="64" height="64" rx="16" fill="#0B0C10" />
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#borderGradient)" stroke-width="2" />

  <!-- Cleaned & Centered Gold Trophy -->
  <g transform="translate(32, 32)">
    <!-- Trophy Handles -->
    <path d="M-15 -10 H-20 C-22 -10 -24 -8 -24 -5 V-2 C-24 2 -21 5 -17 5 H-14" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" />
    <path d="M15 -10 H20 C22 -10 24 -8 24 -5 V-2 C24 2 21 5 17 5 H14" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" />

    <!-- Trophy Cup -->
    <path d="M-15 -14 H15 V-4 C15 4 8 10 0 10 C-8 10 -15 4 -15 -4 Z" fill="url(#goldGradient)" stroke="#FFF2B2" stroke-width="1" />

    <!-- Cup Rim Highlight -->
    <ellipse cx="0" cy="-14" rx="15" ry="3" fill="#FFE57F" />

    <!-- Stem & Base -->
    <path d="M0 10 V18" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round" />
    <path d="M-10 19 H10" stroke="#FFE57F" stroke-width="3.5" stroke-linecap="round" />
    <path d="M-13 22 H13" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>